name: Release

# Builds and packages StandUp when a version tag is pushed (e.g. v1.0.0),
# then publishes a GitHub Release with the .zip asset and its SHA-256.
#
# Signing/notarization is optional: if the repository secrets below are present
# the build is signed and notarized, otherwise an unsigned development build is
# produced. The current development workflow does NOT require signing.
#
#   Optional secrets for signed releases:
#     MACOS_CERT_P12_BASE64   — base64 of your Developer ID Application .p12
#     MACOS_CERT_PASSWORD     — password for that .p12
#     MACOS_SIGN_IDENTITY     — e.g. "Developer ID Application: Name (TEAMID)"
#     NOTARY_APPLE_ID         — Apple ID email
#     NOTARY_TEAM_ID          — Developer Team ID
#     NOTARY_PASSWORD         — app-specific password

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate (optional)
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then echo "No signing cert; skipping."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

      - name: Store notary credentials (optional)
        id: notary
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -z "$NOTARY_APPLE_ID" ]; then
            echo "No notary credentials; skipping."
            echo "profile=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          xcrun notarytool store-credentials "standup-notary" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"
          echo "profile=standup-notary" >> "$GITHUB_OUTPUT"

      - name: Build & package
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
        run: |
          chmod +x scripts/build_release.sh
          scripts/build_release.sh "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP="dist/StandUp-$VERSION.zip"
          SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "StandUp $VERSION" \
            --notes "StandUp $VERSION

          Install via Homebrew:
              brew tap matanganon/standup
              brew install --cask standup

          SHA-256: \`$SHA\`" || gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
